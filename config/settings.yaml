# 运行参数
# 浏览器：脚本不负责登录，只挂载到你自己已登录的 Chrome
cdp_url: "http://127.0.0.1:9222"

# 点「启动浏览器并登录」时直接打开的地址。
# 各表单配置里若填了 form_url，会优先用那个（直达对应的配置页）。
start_url: "https://rich-vip.bilibili.co/manage/v/experiment-manage/strategy-center/list"

# 数据源：支持 .xlsx / .csv
data_file: "data/input.xlsx"
sheet_name: null          # xlsx 用；null = 第一个 sheet
group_key: "分组"          # 多行合并成一条配置的归组列；表里没这列就一行一条

# 行为开关
dry_run: false            # true = 只填不提交，也不问
confirm_before_submit: true   # 每条填完截图 + 等你确认（推荐）
confirm_sample_n: 3       # 「抽样确认」档：前 N 条逐条确认，口径一致后自动跑完剩下的
start_row: 0              # 从第几行开始（0 起）；断点续跑会自动覆盖
resume: true              # 读 output/state.json，跳过已成功的行

# 超时（毫秒）
timeout: 15000
after_submit_wait: 3000

# 输出
screenshot_dir: "output/screenshots"
state_file: "output/state.json"
result_file: "output/result.csv"
log_file: "output/run.log"

# 程序更新。首次安装「带更新功能的版本」后，填入 latest.json 的完整 HTTP(S) 地址即可启用。
# 例：https://download.example.com/config-assistant/latest.json
# 程序只在发现更新、且用户点击「更新并重启」后才下载和安装，不会自动替换正在使用的版本。
update:
  enabled: true
  # GitHub 会始终把「最新 Release」中同名资产映射到这个稳定地址。
  # 每次发布时把最新生成的 latest.json 也作为 Release 资产上传即可。
  #
  # ⚠ 更新分两种包，程序自己挑（见 src/update.py）：
  #     代码包 ~300KB   日常发版走它。整个程序 98MB 里真正会变的只有 src/+assets/。
  #     安装包 ~45MB    只有动了 requirements.txt（运行时变了）才需要。
  #   GitHub Release 在内网实测 20~40KB/s：代码包 8 秒，安装包 40 分钟 ——
  #   这就是拆包的全部理由。latest.json 里每个包可以给多个地址，
  #   把国内镜像排在 GitHub 前面，程序会按顺序试到通为止。
  manifest_url: "https://github.com/Linsanity519/Auto-fill-rebot-inter/releases/latest/download/latest.json"
  check_interval_hours: 12
  timeout_seconds: 10

# 使用统计（主页那些数字的来源）
# 记的是：什么时候、用了哪个配置类型、跑了几条成功几条、花了多久。
# ⚠ 不记任何业务内容 —— 人群名称、价格、活动ID、会议室主题一个字都不写。
#   身份只有一个匿名指纹（用户名+机器名的 hash 前 8 位），反推不回是谁。
usage:
  enabled: true
  # 汇总目录：填一个大家都能访问的共享路径，各人的统计会拷到这里。
  # 公司没有共享盘，所以这条留空不用。
  share_dir: ""

  # ---- 统计回传（2026-08-21 换的通道）----
  # 一个 HTTPS POST 发到企微群机器人，几百毫秒，**不开浏览器、不要人点任何东西**。
  # 留空 = 不上报，只统计本机（首页照常显示自己的数据）。
  #
  # ⚠ 老方案是「开 Chrome → 打开企微文档 → 模拟全选复制粘贴」，已经拆掉：
  #   它要求前端有人、有登录态、页面结构不变，实测坏过 —— 有人用了一整天，
  #   团队表里一条没有，而且失败是静默的。原委见 src/report.py 和
  #   docs/界面方案/主页-使用统计调研.md §2.5.1。
  #
  # ⚠ 这个 key 会随分发包发出去，所以它必须是**专门建的统计群**的机器人：
  #   泄露的最坏情况只是有人往那个群里发消息。
  #   （企微文档机器人那把 apikey 能读能写、更方便，但它没法限权、一把覆盖持有人
  #     名下所有文档，绝不能进分发包 —— 它只留在收集端 tools/.mcp_key。）
  # ⚠ 这里留空是**故意**的，不是忘了填：实际地址在 config/webhook.txt。
  #   为什么拆出去：安装包升级时不覆盖 settings.yaml（怕冲掉用户改的配置），
  #   地址若只存在这里，老用户升上来就永远是空的、统计静默失效。
  #   webhook.txt 则是 ignoreversion，每次升级都刷新。
  #   这里填了就以这里为准（本机想换个群时用）。解析顺序见 src/report.py。
  webhook_url: ""

  # 团队快照的地址。首页那个「N 人在用 / 团队共省了多少时间」从这里拉。
  # ⚠ 这条是为了把「统计新鲜度」和「发版」解耦：team.json 本来打进安装包，
  #   同事看到的最新只到上次发版。改成运行时拉之后，收集端 git push 一次，
  #   大家下次打开就看到（raw 有几分钟 CDN 缓存）。
  # 留空 = 只用安装包里带的那份（老行为）。拉不到也只是继续用本地那份，不影响使用。
  team_url: "https://raw.githubusercontent.com/Linsanity519/Auto-fill-rebot-inter/main/config/team.json"

  # 上报里显示的名字。留空就只有匿名指纹（8 位哈希），反推不回是谁。
  # 想让自己那行在统计里认得出来才填。
  nickname: ""

  # ---- 「省了多少时间」怎么算 ----
  # mode: baseline   人工基准 × 成功条数 − 机器实跑（推荐，默认）
  #       multiplier 机器实跑 × 倍数（想要极简口径时用，改 multiplier）
  #
  # ⚠ 为什么默认不用倍数：倍数会跟着脚本快慢反着走 —— 脚本优化快了，报出来的
  #   「省时」反而变少；某次网络卡十分钟，倒成了大功一件。人工基准跟脚本快慢无关，
  #   它衡量的是「这件事本身值多少时间」。
  # ⚠ 埋点文件里存的永远是实测秒数，这里的换算只在显示时做 —— 数字改了，
  #   历史数据会跟着一起重算，不用回头补。
  #
  # ⚠ 下面这些数**不是拍脑袋填的，也不是实测的，是算出来的**：
  #     python tools\human_baseline.py
  #   那个脚本按 config/forms/*.yaml 里每个字段的控件类型（图片上传 45 秒、
  #   日期控件 20 秒、多选 15 秒、下拉 10 秒、文本 8 秒…）加起来，
  #   再加每条固定开销（保存、等页面跳转、核对）。改这里之前先跑一遍那个脚本，
  #   要调就调脚本里的单价，别直接改结果 —— 不然下次没人说得清这个数怎么来的。
  #   校准办法：找人拿秒表真做一条，和脚本算出来的对一下。
  # ⚠ 一条 = 埋点里记成功的一条：资源位投放是「一个单元 + 它的创意」，
  #   原生商广是「一个单元（含它下面几条创意）」。
  # 2026-08-21 先按倍数走：人工 = 机器实跑 × 3，省下 = 人工 − 机器实跑 = 机器实跑 × 2。
  # 下面 per_item_seconds 那套人工基准留着不删 —— 想换回按字段数估的口径，
  # 把 mode 改回 baseline 就行，历史数字会自动重算（埋点存的一直是实测秒数）。
  saving:
    mode: multiplier
    multiplier: 3
    default_seconds: 120        # 没在下面列出来的配置类型按这个算
    per_item_seconds:
      资源位投放: 420      # 单元层+创意层平均 326 秒（各资源位 132~422 不等）+ 90 秒页面开销
      原生商广: 600        # 单元层 187 + 3 条创意 318（封面要手动压到 700KB 以内）+ 90
      DMP人群新建: 90      # 7 个字段 64 秒 + 40 秒开弹窗/提交
      DMP延期: 90          # 不是填表，是「翻列表找到这条 → 点延期 → 一个月一个月试最晚可选日」
      价格配置: 90         # 6 个字段 51 秒 + 30 秒开销
      # 大头不在字段多，在「每个 SKU 都要单独点开配一遍」：选搭售类型 + 在一两百条
      # 的下拉里找 pid + 选买赠商品（按 4 个 SKU 算 280 秒），外加套餐排列纯手工拖
      # （48 秒）。策略中心供的 24 个字段人工做要每单元重填一遍（201 秒）。
      价格面板配置: 630
      AB实验延期: 60       # 同 DMP延期，少一步搜索
      预定会议室: 0        # 抢会议室不按时长算价值，看「抢中率」
