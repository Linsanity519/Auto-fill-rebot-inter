# ============================================================
# 价格策略批量开关
# 结构抓取：见 docs/价格策略批量开关-配置项抓取.md ——【改这个文件之前先看那份】
# ============================================================
# ⚠ 前端是 Ant Design，满页 css-1a75fj6 / css-var-«ra1» 编译哈希，一个都不能用。
#   定位一律：表头含「状态」且含「操作」的那张 table → tr.ant-table-row →
#   第 1 个 td 取人群名称、操作列 td 里点 <a>开启</a> / <a>关闭</a>。选择器写死在 src/pt_filler.py。
# ⚠ 往这里加新的顶层键时，回 src/formcfg.py 的 BY_MODE["pt_toggle"] 里登记一下。

name: 价格策略批量开关
description: 策略中心 - 把「价格配置」表里已配好的行批量开启 / 关闭（界面上切方向）

nav:
  group: 价格
  group_order: 3
  label: 价格策略批量开关
  order: 3

mode: pt_toggle

# 不吃 Excel：开哪些行由「方向 + 范围 + 关键词」决定，或读本工具的配置台账
data_source: none

# 界面上：这是个「批量开关」类型 —— 藏掉数据文件那一行，露出「方向 / 名称关键词 / 策略」几个控件
toggle: true

# 方向（开启 / 关闭）是界面上切的，不写死在这里。留 direction 只是给命令行兜底用。
direction: "on"

# 本工具「价格策略配置」跑完会往这个台账里记一批（策略 + 人群名称清单 + 时间），
# 「按本工具配置过的」范围读的就是它。台账文件：output/ 下，见 src/pt_ledger.py。
ledger: 价格策略开关

# 「选哪些行」——界面上是一排 segmented，不是共用的「延期范围」那一行。
# 后端仍按 scope 值走（keyword / ledger / list）。第一项是默认。
scopes:
  - ["按名称关键词", "keyword"]
  - ["本工具配置过的", "ledger"]
  - ["按清单", "list"]

# 页面 —— 不导航（策略范围=当前页时读当前页；=指定策略时逐条 goto 编辑页）
form_url: null
# 「价格配置」那张表出来了就算能开始
ready_selector: '.ant-table-row'

ui:
  run_kind: fill
  toggle_hint: "只点「操作」列的开启/关闭，一键直接生效、没有二次确认。已是目标状态的、以及开启方向下人群选组=不限的，自动跳过。跨策略是尽力而为——最稳的用法是自己在浏览器里打开那条策略页，用「当前打开的策略页」"
