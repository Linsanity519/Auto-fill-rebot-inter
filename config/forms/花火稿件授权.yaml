# ============================================================
# 花火稿件授权
# 结构抓取：见 docs/花火稿件授权-配置项抓取.md ——【改这个文件之前先看那份】
# ============================================================
# ⚠ 定位一律走「label 文字 → 字段块 → 块内按选项文字」。
#   不要用编译哈希类名（tw-xxxxxx / css-1a75fj6 / emotion 类），发版即失效。
# ⚠ 往这里加新的**顶层**键时，回 src/formcfg.py 的 BY_MODE["hh"] 里登记一下，
#   不然 tools\check_mode.py 会提示「不认识这个键」。纯 YAML 锚点用 _ 开头。

name: 花火稿件授权
description: 按 Excel 里的稿件 bvid，在「花火内容授权」里逐条发起授权申请

# 侧栏归类
nav:
  group: 商业化广告
  group_order: 5
  label: 花火稿件授权
  order: 9

mode: hh

# ---------------- 页面 ----------------
form_url: 'https://ad.bilibili.co/#/assets/index?activeTab=authorization&type=list&subTab=video_auth'

# 「页面可以开始填了」的判据：列表页上的「添加稿件授权」按钮。
# ⚠ 这一页是 hash 路由，换 tab 不重新加载文档，所以判据挑按钮而不是挑容器。
ready_selector: 'text=添加稿件授权'

# ---------------- 弹窗里的三个控件 ----------------
# 全是 iView（ivu-*）。这些类名是 iView 的公共类，不是编译哈希，可以用。
dialog:
  modal: '.ivu-modal-content'
  title: '添加稿件授权'
  # 「视频」那一行：左边一个类型下拉，右边一个远程校验输入框
  type_select: '.search-type-select'
  type_value: '稿件bvid'          # 下拉默认是「视频链接」，每次都要切
  video_input: '.video-auto-complete input.ivu-input'
  time_group: '.bind-time-type'    # 授权时间：不限 / 30天 / 60天 / 90天 / 自定义
  range_group: '.bind-auth-range'  # 共享范围：同客户&同品牌&同代理 / 同客户&同品牌 / 仅本账号
  agree_checkbox: '.form-footer input[type=checkbox]'
  submit_text: '确定'
  cancel_text: '取消'

# 输入 bvid 后页面自己发的校验接口。预检直接打它，不用开 39 次弹窗。
# 返回 status=success 才是花火稿件；非花火稿件返回 fail +「该稿件不是花火稿件」。
status_api: '/platform/api/web_api/v6/resource/sanlian/commercial_order/archive/status?archive_id='

# ---------------- 默认值 ----------------
# Excel 里那两列留空时用这里的值。选项文字必须和页面上的原文一字不差。
defaults:
  授权时间: 不限
  共享范围: 同客户&同品牌&同代理

# ---------------- 字段 ----------------
# 这个类型只有一张 bvid 清单，列定义写在 src/hh_template.py 的 COLS 里（模板和读取共用），
# 这里不再重复一遍，避免两处漂移。
fields: []
