# ============================================================
# 大会员投放系统（老后台）· 收银台价格面板
# 结构抓取：2026-08-24  manager.bilibili.co/v3/#/vip/resource-delivery/unit/edit/0
# 详见 docs/价格面板配置-配置项抓取.md ——【改这个文件之前先看那份】
# ============================================================
# ⚠ 这是**老系统**，和「资源位投放」跑的 rich-vip 新系统 DOM 完全不同：
#     资源位投放  rich-vip.bilibili.co   Formily（.ant-formily-item）
#     这一份      manager.bilibili.co    Vue SFC + CSS-in-JS 编译类名（tw-xxxxxx）
#   两边选择器一个都不能互抄，连「人群选组」的控件类型都不一样
#   （新系统是单选 + 二级下拉，这边是一个下拉直接选人群类型）。
#
# ⚠ tw- 开头的类名是编译哈希，发版即失效 —— 全部定位都走「label 文字 → 字段块」，
#   和 价格配置.yaml 里对 css-1a75fj6 的处理是同一个道理。
#
# ⚠ 「配一次、全批套用」的字段走**策略中心**（和资源位投放同一套：同一个界面、
#   同样存 config/strategies/、一样能建多套、一样能按单元名称关键词切方案）。
#   所以这里的结构必须是策略中心认识的那一套：positions / unit_common /
#   strategy_groups / scheme_groups。Excel 里只留每个单元真正不一样的那几列。

name: 价格面板配置
description: 大会员投放系统（老后台）- 收银台价格面板单元配置

# 侧栏归类：挂在「价格」这个主 Tab 下、价格策略配置的下面一条
nav:
  group: 价格
  group_order: 3
  label: 价格面板配置
  order: 2

mode: price_panel

# 界面文案，见 资源位投放.yaml 里同名段落的说明
ui:
  deliver_label: 投放配置
  deliver_hint: 配好策略 → 生成模板 → 填好 Excel → 载入并检查 → 跑
  strategy_hint: >-
    生效平台、流量池、收银台类型、面板设置、每个 SKU 的搭售…… 配在这里，Excel
    里就只剩活动和这个面板放哪几个 SKU

# ---------------- 页面 ----------------
# 这个后台的单元页必须挂在一个已有活动下，activityId 从 Excel 里逐单元给。
# activityName 只影响页面上那行面包屑，给个占位也能跑，但给对了好核对。
unit_url_template: >-
  https://manager.bilibili.co/v3/#/vip/resource-delivery/unit/edit/0?back=%252Fvip%252Fresource-delivery%252Funit&activityId={活动ID}&activityName={活动名称}&activityState=1&activityType={活动类型ID}

# 资源位表格里第一列严格等于这个名字的那一行。
# ⚠ 必须全等：页面上还有「加更礼&结局点映收银台价格面板」，包含匹配会串位。
position: 收银台价格面板

# 表格渲染出来 = 页面可用；选完资源位「其他设置」才会出现
ready_selector: 'input[placeholder*="请输入单元名称"]'
position_ready_selector: '.panel-sort-content'
next_button: '保存并下一步'

# 策略中心按资源位组织字段。这个配置类型只有一个资源位，列在这里让它认得。
positions:
  收银台价格面板:
    scene: 收银台
    system: 老后台

# ---------------- SKU 全集（26 项，顺序 = 页面顺序）----------------
# ⚠ 和 价格配置.yaml 里策略中心那 25 项**不是同一套名字**（那边叫「超大年度会员」，
#   这边叫「超大年度套餐」；这边多「异形SKU」「升级超大」，少「异形连续包年」）。
#   两张表各自维护，别互相引用。
skus: &skus [
  '异形SKU',
  '连续包年', '连续包季', '连续包月',
  '年度大会员', '季度大会员', '月度大会员',
  '超大连续包年', '超大连续包季', '超大连续包月',
  '超大年度套餐', '超大季度套餐', '超大月度套餐',
  '权益连续包年', '权益连续包季', '权益连续包月',
  '权益年度大会员', '权益季度大会员', '权益月度大会员',
  '权益超大连续包年', '权益超大连续包季', '权益超大连续包月',
  '权益超大年度套餐', '权益超大季度套餐', '权益超大月度套餐',
  '升级超大'
]

# 「异形SKU」在页面上没有「搭售类型」这一档，直接就是 价格面板pid + 搭售商品，
# 所以它不走 PID 映射表那套，pid 和商品在 Excel 里逐单元填（见 sku_unit_fields）。
sku_map_skip: ['异形SKU']

# 本期适配的搭售类型。页面上还有「加价购」「买赠+加价购」——
# 它们要填的「加购价格信息」是一整块重复行，本期不做。
搭售类型选项: &tie_opts ['无', '买赠', '0元购', '买赠+0元购']

# 「买赠商品」是个 9 选 1 的**商品类型**下拉（readonly，打字过滤不了），
# 选完之后旁边才冒出一个「商品ID」下拉（ph 写着「请输入道具id」但也是 readonly）。
买赠商品类型: &award_kinds ['观影券', '会员天数', '永久装扮', '普通装扮',
                        '会员购抽奖机会', '会员购运费券', '会员购优惠券',
                        '会员购魔晶', '道具']

# ============================================================
# 「投放配置」页上填的（本批共用，不进 Excel、也不进策略中心）
# ============================================================
# ⚠ 这张卡不滚动，只放真正「一次投放一个值」而且会影响别处的东西。
#   生效渠道放这儿是因为它切整张表单 —— 得在生成模板之前就知道。
prep_from_unit:
  - 生效渠道

# 生效渠道 = 定向 时，页面上**不存在**的字段：Excel 不出这些列，跑的时候也不去填。
# 实测清单，别凭印象加减。
# ⚠ 「不往页面上填」不等于「没用」——「生效平台」照旧在策略中心里配，定向下拿它
#   去 PID 映射表里挑 pid（见 pp_data.sku_map）。别因为它在这张单子上就从
#   strategy_groups 里删掉：删了 pid 就退回「这个卡种有几个填几个」，
#   只投 iPhone 的单元会把安卓/PC/HD 一起挂上。
direct_drops:
  - 人群选组
  - 排除人群选择
  - AB实验
  - 生效平台
  - 运营商
  - 省份
  - 投放区域
  - 频次周期
  - 展示不超过
  - 优先级
  - 内容设置
  - 生效内容
  - 内容黑名单
  - 内容类型
  - 赠单片
  - 可赠单片价格
  - 创意赛马

# ============================================================
# 活动层（和资源位投放共用同一个页面）
# ============================================================
# 老后台活动列表页点「新建活动」→ 直接跳到 rich-vip 的活动页，字段和资源位投放
# 那一步一模一样（实测 2026-08-26，9 个 .ant-formily-item 完全对得上）。
# 两边只是外壳路由不同：
#   资源位投放  /manage/v/delivery-manage/delivery-list/delivery/edit-activity
#   老后台跳的  /manage/v/big-vip/delivery/activity
# ⚠ 直连 /delivery/activity（不带 /manage/... 前缀）渲染的是空壳，别用。
#
# 「投放配置」页上选「本次新建活动」才走这一步，模板也才会多一张「活动」sheet；
# 选「挂到已有活动」就只在界面上填一个活动ID，Excel 里不出现任何活动列。
activity:
  sheet: 活动
  url: 'https://rich-vip.bilibili.co/manage/v/big-vip/delivery/activity?type=edit&id=0'
  ready_selector: '.ant-formily-item'
  next_button: '保存并下一步'
  done_when:
    url_matches: '/unit/edit/|/delivery/unit/'
  carry_params: ['activityId', 'activityType']
  fields:
    - {name: 活动名称, label: 活动名称, type: fill_by_label, required: true}
    - name: 活动类型
      label: 活动类型
      type: select_antd_by_label
      required: true
      options: ['站内收入活动', '外渠活动', '权益活动', '日常策略', '测试验收']
      reveals:
        站内收入活动:
          - {name: 子活动类型, label: 子活动类型, type: select_antd_by_label, required: true,
             options: ['站内-大促', '站内-日常活动', '站内-内容营销', '站内-其他']}
        外渠活动:
          - {name: 子活动类型, label: 子活动类型, type: select_antd_by_label, required: true,
             options: ['外渠-免费领', '外渠-运营商', '外渠-金融', '外渠-其他']}
        权益活动:
          - {name: 子活动类型, label: 子活动类型, type: select_antd_by_label, required: true,
             options: ['合作权益(线上)', '合作权益(线下)', '功能权益', '品牌营销', '生日礼', '其他']}
    - {name: 活动开始时间, label: 活动开始时间, type: date_by_label, required: true}
    - {name: 活动结束时间, label: 活动结束时间, type: date_by_label, required: true}
    - {name: 活动目标GMV(万), label: 活动目标GMV(万), type: fill_by_label}
    - {name: 活动app_id, label: 活动app_id, type: fill_by_label}
    - {name: 活动app_sub_id, label: 活动app_sub_id, type: fill_by_label}
    - {name: 关联定价策略, label: 关联定价策略, type: radio_by_label,
       options: ['不限', '所有策略', '指定策略', '不关联策略']}
    - {name: 关联物料, label: 关联物料, type: fill_by_label}

# ============================================================
# Excel 里逐单元填的列
# ============================================================
# 只留「每个单元真的不一样」的：名字、时间、这个面板放哪几个 SKU、投给谁。
# 其余一律由策略中心供值。
# ⚠ 活动不在这儿。活动是「本批共用一个」，在「投放配置」页上选：
#   新建活动 → 模板多一张「活动」sheet（填一行）；挂到已有活动 → 界面上填活动ID。
unit_fields:
  - name: 单元名称
    label: 单元名称
    type: pp_text
    required: true
    _note: '最多 24 字。⚠ 策略中心的「按单元名称匹配」就是拿它去撞关键词的'

  # ⚠ 这两列必填。页面上「投放时间」是必填项，而且**只有 URL 里带了
  #   startTime/endTime 时才会自动带出活动的起止时间** —— 我们拼的 URL 不带
  #   （那是两个 unix 时间戳，没道理让人去后台链接里抠），留空就是两个空框。
  - name: 投放开始时间
    label: 投放时间
    type: pp_date
    index: 0
    required: true
    _note: '格式 2026-09-24 10:00:00（年-月-日 时:分:秒，年份不能省）'
  - name: 投放结束时间
    label: 投放时间
    type: pp_date
    index: 1
    required: true
    _note: '格式 2026-09-24 10:00:00'

  # ---- 套餐排列：正常由策略中心的方案给；这三列是「个别单元要不一样」时的后门 ----
  # ⚠ 留空是正常情况，不是漏填。三列都留空 = 完全听策略中心的。
  - name: 面板1套餐
    _note: '留空 = 用策略中心「SKU选择 + 面板套餐 + 套餐排序」方案里的；填了就以这里为准。英文逗号分隔，顺序就是从左到右'
  - name: 面板2套餐
    _note: '同上。三列的并集就是页面上「sku选择」要勾的；面板2 空 = 只有一个面板'
  - name: 隐藏sku面板套餐
    _note: '同上。选了这一段，页面上「面板个数」会自动变成「2个+查看更多」'

# ============================================================
# 单元层页面字段（策略中心从这里认字段：类型、选项、必填、级联）
# ============================================================
unit_common:
  # ---- 定向投放 ----
  # ⚠ 只放「全局」这一个选项，不是漏了。实测选「定向」之后整个「定向投放」段会换掉：
  #   人群选组 / 排除人群选择 / AB实验 / 生效平台 / 运营商 / 省份 / 投放区域 全部消失，
  #   改成一个「价格面板panel_type」，频次和优先级也不见了 —— 那是另一套表单，本期没抓。
  # ⚠ 这一项**切的是整张表单**，不是普通单选。实测（2026-08-26 新建态）：
  #     全局  36 个字段
  #     定向  18 个字段 —— 人群选组 / 排除人群选择 / AB实验 / 生效平台 / 运营商 /
  #           省份 / 投放区域 / 频次限制 / 优先级 / 内容设置 / 赠单片 / 创意赛马
  #           全部消失，多出一个「价格面板panel_type」
  #   所以它在「投放配置」页上填（prep_from_unit），是「本批投放长什么样」的一部分，
  #   而且 Excel 出哪些列、策略中心管哪些字段都跟着它变 —— 见 direct_drops。
  - name: 生效渠道
    label: 生效渠道
    type: pp_radio
    required: true
    options: ['全局', '定向']
    default: 全局
    _note: '选「定向」之后整张表单换一套，Excel 里那些定向没有的列不会再出'
    reveals:
      '定向':
        # ⚠ 和「商品ID」同一族：**点开是空的，要打字才远程搜出来**，而且慢。
        #   别照着「点开看有没有选项」下结论 —— 我就这么误判过一次，
        #   打了个 n 等 5 秒没出来就写成「取值范围拿不到、定向做不了」。
        #   实测填 normal 能搜出来。
        - {name: 价格面板panel_type, label: 价格面板panel_type, type: pp_select_search,
           required: true, default: normal,
           _note: '填 normal（打字远程搜，回来得等几秒）'}
  # ⚠ 人群这两组走 Excel 逐单元填，不进策略中心（2026-08-26 改）。
  #   原因：一批单元里「投给谁」几乎每行都不一样，而策略中心一套方案只能存一个值；
  #   而且真正要填的是三级那个「具体哪个人群包」，方案库存不住。
  - name: 人群选组
    label: 人群选组
    type: pp_select
    required: true
    options: ['不限', '基本人群（实时数据）', '指定人群包（离线数据）',
              '特殊人群包（当前人群特征无法满足的人群包）', 'OGV DMP 人群包', '外部人群']
    _note: '选「不限」= 不圈人群；选别的会再冒出一个「具体投哪个」的字段'
    reveals:
      '基本人群（实时数据）':
        - {name: 我想投放, label: 我想投放, type: pp_select_search,
           _note: '页面上是远程搜索下拉，不打字返回 0 条 —— 这里填的词会被打进去搜'}
      '指定人群包（离线数据）':
        - {name: 人群分组ID, label: 人群分组ID, type: pp_select_search,
           _note: '只读下拉，填分组名或 ID 的一段去匹配'}
      '特殊人群包（当前人群特征无法满足的人群包）':
        - {name: 人群包key, label: 人群包key, type: pp_text,
           _note: '文本框，多个用英文逗号分隔'}
      'OGV DMP 人群包':
        - {name: 人群名称, label: 人群名称, type: pp_select_search,
           _note: '远程搜索，填人群ID（如 35697），页面显示成「【暑促短信】8月1日2(35697)」'}
      '外部人群':
        - {name: 人群来源, label: 人群来源, type: pp_select,
           options: ['移动-全球通-SDK', '联通-王卡-API撞库', '江苏电信', '招行人群']}

  - name: 排除人群选择
    label: 排除人群选择
    type: pp_select
    required: true
    # ⚠ 比上面少「指定人群包（离线数据）」和「外部人群」两档，是页面原样。
    # ⚠ 这里的「OGV DMP人群包」没有空格，和上面那个不一样，也是页面原文。
    options: ['不限', '基本人群（实时数据）',
              '特殊人群包（当前人群特征无法满足的人群包）', 'OGV DMP人群包']
    _note: '选「不限」= 不排除'
    # ⚠ 排除侧的三级字段 label 和投放侧同名（页面原样），靠「在排除那个字段块里找」
    #   来区分，不是靠 label —— 所以 name 另起一个，别和上面重名。
    reveals:
      '基本人群（实时数据）':
        - {name: 我想排除, label: 我想投放, type: pp_select_search, scope: exclude,
           _note: '排除侧的远程搜索下拉'}
      '特殊人群包（当前人群特征无法满足的人群包）':
        - {name: 排除人群包key, label: 人群包key, type: pp_text, scope: exclude,
           _note: '多个用英文逗号分隔'}
      'OGV DMP人群包':
        - {name: 排除人群名称, label: 人群名称, type: pp_select_search, scope: exclude,
           _note: '填人群ID'}
  - {name: AB实验, label: AB实验, type: pp_radio, options: ['无', '有']}
  - {name: 生效平台, label: 生效平台, type: pp_checkbox, required: true,
     options: ['Android', 'iPhone', 'iPad', 'PC', 'iPad HD', 'Android HD',
               '鸿蒙phone', '鸿蒙pc', '鸿蒙tablet']}
  - {name: 运营商, label: 运营商, type: pp_checkbox, required: true,
     options: ['中国移动', '中国电信', '中国联通']}
  - {name: 投放区域, label: 投放区域, type: pp_checkbox, required: true,
     options: ['国内', '海外']}
  - {name: 省份, label: 省份, type: pp_multiselect,
     _note: '多个用英文逗号分隔；「不限」就是不限制'}

  # ---- 投放设置 ----
  - {name: 投放流量池, label: 投放流量池, type: pp_radio, required: true,
     options: ['日常池', '特殊最优池']}
  - {name: 频次周期, label: 频次限制, type: pp_select, options: ['每日', '每周']}
  - {name: 展示不超过, label: 频次限制, type: pp_number, index: 1,
     _note: '正整数；留空或 -1 = 不限制'}
  - {name: 优先级, label: 优先级, type: pp_text, _note: '0-101'}

  # ---- 其他设置 · 面板级 ----
  # ⚠ 「内容设置」「赠单片」挂在它底下不是排版好看 —— 实测**只有勾了
  #   「播放页半屏收银台」，这两项才在页面上存在**（label 里那句「仅面向播放页收银台」
  #   是字面意思）。不这么写的话，配一个只投全屏收银台的单元会报「页面上找不到字段」。
  - name: 收银台类型
    label: 收银台类型
    type: pp_checkbox
    required: true
    options: ['全屏收银台', '播放页半屏收银台', '会员中心极简收银台', 'PC播放页收银台',
              'PC全屏收银台', '超大抢先看收银台', 'PC超大抢先看收银台']
    _note: '页面默认勾的是前三个'
    reveals:
      '播放页半屏收银台':
      - name: 内容设置
        label: 内容设置（仅面向播放页收银台）
        type: pp_radio
        required: true
        phase: after
        options: ['默认', '指定']
        reveals:
          '指定':
            - {name: 生效内容, label: 生效内容, type: pp_radio, phase: after,
               options: ['全部', '部分分区', '指定内容'],
               _note: '⚠ 选「部分分区」「指定内容」还要再挑具体内容，本期没抓'}
            - {name: 内容黑名单, label: 内容黑名单, type: pp_radio, phase: after,
               options: ['不需要', '需要']}
            - {name: 内容类型, label: 内容类型, type: pp_checkbox, phase: after,
               options: ['会员专享内容', '免费内容', '会员折扣内容', '原价付费内容']}
      - name: 赠单片
        label: 赠单片（仅面向播放页收银台）
        type: pp_radio
        phase: after
        options: ['默认', '指定']
        reveals:
          '指定':
            - {name: 可赠单片价格, label: 赠单片（仅面向播放页收银台）, type: pp_number,
               phase: after, _note: '页面上是「可赠单片价格 ≤ N 元」'}
  # ⚠ 不配置，由三个面板列推出来（pp_data.panel_count_of）。定义留着是因为
  #   页面上这个控件还是要点的 —— 它决定套餐排列有几段。
  - {name: 面板个数, label: 面板个数, type: pp_radio, scope: derived,
     options: ['2个', '1个', '2个+查看更多']}

  # ⚠ 下面这几项带 phase: after —— 必须等 sku选择 / 套餐排列 / 逐张卡片的搭售
  #   都弄完了再填。实测：**点 SKU 卡片、改 sku选择 都会把这几个面板级单选
  #   打回默认值**（拖拽不会）。先填的话最后全白填，页面上还看不出来。
  - name: 选中类型
    label: 选中类型
    type: pp_radio
    required: true
    phase: after
    options: ['默认', '指定套餐']
    _note: '默认逻辑：限时红包优惠力度最大 > 价格面板选中 > 排序首个套餐'
    reveals:
      '指定套餐':
        # ⚠ 按「选中类型」块里的第几个下拉定位，不按 label：面板个数=2个 时页面上
        #   确实有「面板1」「面板2」两个 label，但 **=1个 时那两个 label 不存在**，
        #   下拉直接挂在「选中类型」底下 —— 按 label 找会报「找不到字段 面板1」。
        - {name: 面板1选中套餐, label: 选中类型, type: pp_select, index: 0, phase: after,
           _note: '填 SKU 名，例：连续包年'}
        - {name: 面板2选中套餐, label: 选中类型, type: pp_select, index: 1, phase: after,
           _note: '「面板个数」= 1个 时留空'}

  # ---- 算法策略 ----
  - {name: 创意赛马, label: 创意赛马, type: pp_radio, required: true,
     options: ['不需要', '需要']}

  # ---- 下面这些不是页面上的控件，是给策略中心当「方案的内容」用的 ----
  # scope: manual = 通用填写循环跳过它们，由 pp_runner 自己消费
  #   面板1/2套餐        → 决定 sku选择 勾哪些、套餐排列拖成什么顺序
  #   买赠SKU / 0元购SKU → 哪些 SKU 搭售、搭哪种（页面上每张卡的「搭售类型」单选）
  #   PID映射方案        → 去 PID 映射表里捞这一套的 pid / 买赠商品 / 组合价格
  # 三个面板各挑哪些 SKU、按什么顺序摆。界面上是「按顺序点选」：
  #   点中的顺序 = 页面上从左到右的顺序；三个面板的选项互斥（同一个 SKU 只能落一处）；
  #   哪儿都没选中的 SKU = 页面上「sku选择」不勾它。
  # ⚠ 「面板个数」不用配，由这三列推出来（见 pp_data.panel_count_of）：
  #     只有面板1        → 1个
  #     面板1 + 面板2    → 2个
  #     再加隐藏sku面板  → 2个+查看更多
  - {name: 面板1套餐, type: pp_panel_pick, scope: manual, exclusive_key: panel,
     options: *skus, _note: '页面「套餐排列」里面板1(推荐)，从左到右'}
  - {name: 面板2套餐, type: pp_panel_pick, scope: manual, exclusive_key: panel,
     options: *skus, _note: '页面「套餐排列」里面板2。一个都不选 = 只要一个面板'}
  - {name: 隐藏sku面板套餐, type: pp_panel_pick, scope: manual, exclusive_key: panel,
     options: *skus, _note: '页面「套餐排列」里第三段。选了才会变成「2个+查看更多」'}

  # ---- 搭售：哪些 SKU 搭、搭哪种 ----
  # ⚠ 页面上「搭售类型」是一个六选一的单选（无/买赠/加价购/0元购/买赠+加价购/买赠+0元购），
  #   但后台存的是**两个互不相干的字段**：sale_strategy(none|award) 和 add_type(''|zero|add)。
  #   所以这里就按后台那样做成两个多选，两个都选中的 SKU 就是「买赠+0元购」，
  #   不用再单开一个「买赠+0元购SKU」的桶（那样还得防着三个桶互相打架）。
  #   两个都没选中 = 这个 SKU 的搭售类型是「无」。
  # ⚠ 只对上了面板的 SKU 有意义；异形SKU 不在这里（它页面上没有「搭售类型」这一档）。
  # ⚠ ui: sku_tie_badge —— 这两项在策略中心里**不单独占一行**，它们是套餐卡片右边那个
  #   小角标（点开四选一：无 / 买赠 / 0元购 / 买赠+0元购）读写的两个存盘字段。
  #   「这个 SKU 上不上面板」和「它搭什么」本来就是一个决定，拆成两处填必然对不上。
  - {name: 买赠SKU, type: pp_sku_pick, scope: manual, options: *skus, ui: sku_tie_badge,
     _note: '搭售类型带「买赠」的 SKU。买赠送什么商品，在 PID 映射表里按 SKU 配'}
  - {name: 0元购SKU, type: pp_sku_pick, scope: manual, options: *skus, ui: sku_tie_badge,
     _note: '搭售类型带「0元购」的 SKU。加购什么，在 PID 映射表的「组合价格」里配'}

  - {name: PID映射方案, type: pp_manual, scope: manual,
     options: ['常规收银台', '算法收银台', '权益_常规', '权益_算法', '续费'],
     _note: '用 PID 映射表里哪一套（「方案名」那一列）。它只管「pid 和商品是什么」，不管「哪些 SKU 搭售」—— 后者是在套餐卡片上点的'}
  - {name: PID映射表, type: pp_file, scope: manual,
     _note: '一个单独的 Excel，维护「方案名 → 每个 SKU 各平台的 pid / 买赠商品 / 组合价格」。生成模板时会一起产出一份空表'}


# ============================================================
# 策略中心：通用规则分组（一个字段一个值，整批共用）
# ============================================================
# ⚠ 生效渠道 / 收银台类型 / 面板个数 / 选中类型 / 赠单片 **不在这里** ——
#   它们在「投放配置」页上填（见下面的 prep_from_unit）：这几项是「本批投放长什么样」，
#   跟着这次投放走，不跟着策略走。
# ⚠ 人群、面板套餐、搭售都不在这里，它们是方案组（见 scheme_groups）。
strategy_groups:
  定向投放:
    - AB实验
    - 生效平台
    - 运营商
    - 投放区域
    - 省份
  投放设置:
    - 投放流量池
    - 频次周期
    - 展示不超过
    - 优先级
  # 页面上「其他设置」那一段里跟着「这批投放长什么样」走的几项。
  # ⚠ 收银台类型 2026-08-26 从 excel_from_unit 搬进来，连带把「内容设置」「赠单片」
  #   两串子字段一起收拢 —— 它们的级联父字段就是收银台类型，之前一半在 Excel、
  #   一半在策略中心，导致策略中心里「内容限制」那一组永远判定为不显示（父字段取不到值）。
  #   父子必须在同一处，不然要么看不见、要么两边打架。
  收银台与内容:
    - 收银台类型
    - 内容设置
    - 生效内容
    - 内容黑名单
    - 内容类型
    - 赠单片
    - 可赠单片价格
  算法策略:
    - 创意赛马
  # 只剩「那份 Excel 在哪」。用哪一套（方案名）跟着套餐方案走，在下面的 scheme_groups 里。
  # ⚠ 异形SKU 的 pid / 搭售商品 2026-08-26 从这儿搬走了：它现在就是套餐里的一个普通选项，
  #   选中了才在 Excel 里逐单元填那两项（见 sku_unit_fields）—— 那两个值本来就是
  #   一个单元一个样，配在「整批共用」的策略里从一开始就不对。
  PID映射:
    - PID映射表

# ============================================================
# Excel 里逐单元填的页面字段（定义在 unit_common，这里只写名字）
# ============================================================
# ⚠ 「投放配置」页上只有一件事：选 Excel。可填的东西要么在 Excel 里、
#   要么在策略中心里，不再有第三个地方 —— 三个地方找一个值太难了。
# ⚠ 收银台类型 / 赠单片 2026-08-26 搬去策略中心了（见 strategy_groups 的「收银台与内容」）：
#   一批单元基本都投同一批收银台，跟着策略走；而且它是「内容设置」「赠单片」的级联父字段，
#   父子分处两地的话策略中心里那一组根本显示不出来。
excel_from_unit:
  # 人群：2026-08-26 从策略中心搬到这里，逐单元填（reveals 出来的三级字段自动跟过来）
  - 人群选组
  - 排除人群选择
  - 选中类型

# ============================================================
# 策略中心：方案组（一整套打包、可按单元名称关键词切换）
# ============================================================
# 用法和资源位投放的方案组一个样：
#   全部用同一套    —— 整批单元共用
#   按单元名称匹配  —— 「关键词 → 方案」表，单元名字里带哪个词就用哪套
#
# ⚠ 2026-08-26 起只剩这一组：
#   · 「人群」搬去 Excel 逐单元填（见 excel_from_unit）
#   · 「搭售」并进了这一组 —— 「放哪几个 SKU」和「这几个 SKU 搭不搭售」本来就是
#     同一件事的两半，分成两组配就能配出「面板里没有的 SKU 却配了买赠」这种状态。
scheme_groups:

  # 页面上是两个控件（sku选择、套餐排列），这里合成一组两列。合并是无损的：
  #   sku选择   = 面板1套餐 + 面板2套餐 的并集（页面上勾中的 SKU 就是排列里的卡片，
  #              一个不多一个不少，机器人按并集去勾）
  #   套餐排列 = 两列各自的书写顺序；分隔线就是两列的分界
  # 分开维护反而能写出页面上不存在的状态（勾了 A/B/C、排列里只有 A/B），所以不拆。
  # ⚠ key: panel 是存盘键，改了会丢已配好的方案，别动 —— 改的只是显示名。
  SKU选择 + 面板套餐 + 套餐排序:
    key: panel
    exception_field: 套餐方案
    # 一套方案 = 「这批单元的价格面板长什么样」：放哪几个 SKU、怎么排、搭不搭售。
    # ⚠ 2026-08-26 把搭售并了进来，分两件事：
    #   · 哪些 SKU 搭售、搭哪种 —— 套餐卡片右边的小角标（存进 买赠SKU / 0元购SKU）
    #   · 搭什么、用哪个 pid   —— PID映射方案 指到 PID 映射表里的一套
    #   这样「面板里放了哪些 SKU」和「这些 SKU 各自搭什么」在同一张卡上一眼对得起来。
    fields:
      - 面板1套餐
      - 面板2套餐
      - 隐藏sku面板套餐
      - 买赠SKU
      - 0元购SKU
      - PID映射方案
    # ⚠ Excel 的「面板1套餐/面板2套餐」两列填了的话以 Excel 为准（逐单元覆盖）。
    # ⚠ 单元 Excel 里的创意列也是按这一组推出来的：出现在三段面板里的 SKU 才有创意列，
    #   其中角标标了买赠的 SKU，再多出买赠那几列。见 pp_data.sku_columns。
    presets:
      - name: 年卡优先·双面板
        note: sku选择 = 连续包年/年度大会员/月度大会员；排列成 面板1[连续包年,年度大会员] 面板2[月度大会员]；不搭售
        keywords: ['年卡', '新客']
        values:
          面板1套餐: 连续包年,年度大会员
          面板2套餐: 月度大会员
      - name: 单面板·年卡
        note: sku选择 = 三个年月卡；只有一个面板，记得把「投放配置」页的「面板个数」也改成 1个
        keywords: []
        values:
          面板1套餐: 连续包年,年度大会员,月度大会员
      - name: 常规收银台·带买赠
        note: 双面板；连续包年 买赠+0元购、超大连续包年 买赠，pid 用 PID 映射表「常规收银台」那一套
        keywords: ['买赠', '搭售']
        values:
          面板1套餐: 连续包年,超大连续包年,连续包季,连续包月
          面板2套餐: 年度大会员,季度大会员,月度大会员
          买赠SKU: 连续包年,超大连续包年
          0元购SKU: 连续包年
          PID映射方案: 常规收银台

# ============================================================
# 「上了面板才要填」的单元层字段
# ============================================================
# 和创意列同一个机制：SKU 出现在三段面板里，Excel 才多出「<SKU>·<字段>」这几列；
# 没上面板就一列都不出。区别只在于它们填的是**单元页**（其他设置里那张 SKU 卡片），
# 不是创意页 —— 模板的表头配色和填写说明按这个分组。
#
# ⚠ 目前只有异形SKU。它页面上没有「搭售类型」那一档，就固定一对 pid + 搭售商品，
#   而这两个值一个单元一个样（不同活动搭不同的联合会员），所以只能逐单元填。
sku_unit_fields:
  异形SKU:
    - {name: 价格面板pid, label: 价格面板pid, type: pp_select_search, required: true,
       _note: '只填 pid 数字，例 11439；页面上显示成「11439(normal,ipad,连续包年,人群包,148.00元)」'}
    - {name: 搭售商品ID, label: 搭售商品, type: pp_select_search, required: true,
       _note: '商品ID，例 1203925820654039797（页面显示成「1203925820654039797(京东PLUS年卡)」）'}

# ============================================================
# 创意层（2026-08-26 抓：单元 40900 / 40817 / 40773 / 40540 / 33283，只读打开）
# ============================================================
# ⚠ 创意层不在老后台里。单元保存后跳到**新系统**，而且是第四套 DOM（Arco Design，
#   class 前缀 arco-）：单元层是 tw-、资源位投放新系统是 Formily/mega-ant-、
#   价格配置是 antd。选择器一个都不能抄。
#
# ⚠ 页面形态：顶上「套餐排列」是一条**只读的 SKU 卡片条**，点一张卡才显示这张卡的字段，
#   同一时刻只显示一张。选了 N 个 SKU 就要点 N 次、配 N 遍。
#   卡片有哪些、怎么分面板，来自单元层（price_panels 里 show=0 表示选中，group=1/2 分面板）。
#
# ★ 创意层字段完全由**这个 SKU 的搭售类型**决定 —— 没有别的总开关。
#   同一条创意里，A 套餐是「买赠」就多 6 个要填的字段，B 套餐是「无」就只有 2 个。
#
# ⚠ 用直连地址打开创意页，已存创意的内容不会回填（实测 40900 有创意 137896、
#   40817 有 3 条，页面照样是空表单）。要读已存内容走
#   /x/admin/vas/ads/originality/v3/by_unitid?unit_id=<单元ID>。
creative:
  url: 'https://rich-vip.bilibili.co/delivery/creativity?unitId={unit_id}&position={position_id}'
  position_id: 35
  ready_selector: '.arco-form-item'
  # 「套餐排列」那个 form-item 里，按 SKU 名字点卡片
  card_scope: '套餐排列'
  submit: '保 存'
  add_creative: '新增创意'

  # ---- 面板级：不属于任何 SKU，切哪张卡都在 ----
  # ⚠ 只有单元层「面板个数」= 2个 / 2个+查看更多 才出现。
  panel_fields:
    - {name: 切换按钮·面板1, label: '面板1:', key: 'panel_list:button_text',
       type: pp_fill, required: true, max: 8, default: '切换普通套餐'}
    - {name: 切换按钮·面板2, label: '面板2:', key: 'panel_list_v2:button_text',
       type: pp_fill, required: true, max: 8, default: '切换推荐套餐'}

  # ---- 每个 SKU 都有，和搭售类型无关 ----
  sku_common:
    - {name: 角标文案, label: sku角标文案, key: sub_title, type: pp_fill, max: 6,
       _note: '1~6 字；配置类型选「图片」时页面提示语会变成 1~10 字。升级超大那张卡是 4~8 字、不填走默认'}
    - {name: 红包弹窗动画, label: 'sku红包弹窗动画(svga文件,500kb内)', key: animated_image,
       type: pp_fill_or_upload,
       _note: '填动画链接，或给本地 svga 路径走上传；500KB 以内'}

  # ---- 按这个 SKU 的搭售类型追加 ----
  # key 是后端 properties 里的字段名（properties[].key = 「<cashier>:<key>」）
  by_tie:
    买赠:
      - name: 配置类型
        label: 配置类型
        key: config_type
        type: pp_radio
        required: true
        options: ['icon+文案', '图片']
        _note: 'icon+文案 = icon_with_text（页面默认）；图片 = image'
        # ⚠ 两个分支各有一个「icon」，但**尺寸和必填不一样**（左边选填 0~240*60、
        #   右边必填 327*327），所以必须各起一个 name —— 同名的话 wizard_schema.flatten
        #   按名字去重只会留下第一处，图片分支那个「必填 327*327」就悄悄没了。
        #   name 直接用页面 label，填的时候也好对。
        reveals:
          'icon+文案':
            - {name: 小灰条文案, label: 小灰条文案, key: gray_tip, type: pp_fill, required: true,
               _note: '如「本次购买赠送10元充电通兑券」「价值30元，单张最高可兑换6元付费电影」'}
            - {name: 'icon(0~240*60)', label: 'icon(0~240*60)', key: icon_240x240,
               type: pp_upload, size: '0~240*60'}
          '图片':
            - {name: 'icon(327*327)', label: 'icon(327*327)', key: background_327x327,
               type: pp_upload, required: true, size: '327*327'}
      - {name: 商品权益名称, label: 商品权益名称, key: commodity_equity_name,
         type: pp_fill, required: true,
         _note: '如「10元充电通兑券」「大会员观影券x5」「任选联合会员季卡」'}
      - {name: 支付成功商品图, label: '支付成功商品图(327*327)', key: image_327x327,
         type: pp_upload, required: true, size: '327*327'}
      - {name: 权益跳转链接, label: 权益跳转链接, key: rights_jump_link,
         type: pp_fill, required: true,
         _note: '如 https://big.bilibili.com/mobile/cardBag'}
    # 0元购只多一个「加购商品id」，而它是只读回显（见 readonly_echo），没有要填的。
    0元购: []

  # ---- 两张特殊卡 ----
  by_sku:
    # 异形SKU 这张卡没有「搭售类型」这一档，也就没有上面 by_tie 那两组
    异形SKU:
      - {name: SKU底图, label: 'SKU底图(654×414)', key: background_654x414,
         type: pp_upload, size: '654*414'}
    升级超大:
      - {name: 升级时长, label: 升级时长, key: sku_month, type: pp_fill, required: true,
         _note: '≥1 的整数，后面跟单位「月」'}
      - {name: 默认选中, label: 默认选中, key: 'sku_month:selected', type: pp_radio}

  # ---- 页面上是灰的只读回显，从单元层带过来，创意里改不了 ----
  # 列在这里只是为了「界面上看到的东西都能对上号」，不进 Excel。
  readonly_echo:
    - {label: 买赠商品, key: grant_type, from: 单元层搭售·买赠商品类型}
    - {label: 商品ID, key: bundle_id, from: 单元层搭售·买赠商品ID}
    - {label: 加购商品id, key: combine_price, from: 单元层搭售·组合价格}
    - {label: 搭售商品, key: grant_token, from: 单元层搭售·搭售商品（异形SKU）}
    - {label: 价格面板pid, key: sku_ids, from: 单元层搭售·价格面板pid}
    - {label: 赠单片价格, key: season_price, from: 单元层·可赠单片价格}

# ============================================================
# PID 映射表（单独的 Excel，路径在「投放配置」页上指定）
# ============================================================
# 表头就是下面这几列，一行一个 SKU。同一份文件里可以放多套，用「方案名」区分。
pid_sheet:
  sheet: PID映射
  # ⚠ 一个 SKU 有好几行，一个平台一行（页面上「价格面板pid」是多选，
  #   一个单元投几个平台就填几个 pid）。
  #   买赠商品 / 组合价格这些是「一个 SKU 一份」，在任意一行填一次就行。
  # ⚠ 这张表**不管「哪些 SKU 搭售」**（2026-08-26 去掉了「搭售类型」那一列）——
  #   那是策略中心里在套餐卡片上点的。这张表只回答「搭什么、用哪个 pid」。
  #   两处都能说同一件事的时候，不一致谁赢没人讲得清，所以只留一处。
  # ⚠ 异形SKU 也不在这张表里，它的 pid / 搭售商品在 Excel 里逐单元填。
  columns:
    - 方案名
    - SKU
    - 平台
    - 价格面板pid
    - 买赠商品类型
    - 买赠商品ID
    - 组合价格

# 「平台」这一列写的是运营那份价格表里的叫法，和页面「生效平台」的选项对不上，
# 这里做个对照。⚠ 带 ? 的是我猜的，用之前先确认。
pid_platform_alias:
  iOS: iPhone
  安卓: Android
  IPAD: iPad
  'IPAD HD': iPad HD
  网页: PC
  鸿蒙phone: 鸿蒙phone
  鸿蒙pad: 鸿蒙tablet
  鸿蒙pc: 鸿蒙pc
  # 微信公众号 / 鸿蒙：页面「生效平台」里没有直接对应的选项，先原样留着
