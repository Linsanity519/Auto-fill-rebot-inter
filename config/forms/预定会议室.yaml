name: 预定会议室
description: 哔哩哔哩行政管理平台 - 掐着开放时刻抢会议室

# 侧栏归类：group 是主 Tab，label 是它下面这一项的名字。
# ⚠ 只有 label 是给人看的；name（也就是文件名）才是身份，断点、模板、
#   config/prep 下的存盘都认它，改 label 不会动到这些。
nav:
  group: 日常办公
  group_order: 6
  label: 预定会议室
  order: 1
mode: meeting_reserve

form_url: 'https://administration.biliapi.net/f1-space/web/index.html#/home/meeting/reserve'

# ⚠ 这个配置类型不读 Excel、也不点 DOM。
#   任务清单在界面上直接填（存 config/prep/预定会议室.json），执行时直接发接口。
#   为什么不点 DOM：这是抢占场景，窗口开的那一瞬间全公司都在刷，
#   等 SPA 把日历渲染出来再定位格子是「秒」级，发接口是「百毫秒」级。
#   接口清单和签名算法见 src/meeting_api.py 的模块注释。

# ============================================================
# 抢占参数
# ============================================================
grab:
  # 每天几点翻页。后端原文（2026-08-20 提交窗口外日期时它自己吐出来的）：
  #   「10点之前只能预定5个工作日之内的会议室，10点之后才可预定第6个工作日的会议室」
  # 所以是每天 10:00 放出「第 6 个工作日」，不是零点。
  open_time: "10:00"

  # ⚠ 这里没有「提前几天」这个参数，是故意的。
  #   规则按**工作日**算，不是自然日 —— 而工作日要扣法定节假日、还要算调休补班，
  #   本地没有权威日历，写死任何一个天数迟早出错（第一版就是按 7 个自然日写的，
  #   那只是在「不跨节假日」时碰巧对得上）。
  #   现在的做法：开抢时刻由 src/meeting_data.open_moment() 按上面那条规则算，
  #   只用来决定「哪天醒过来」；真正扣扳机前一定拿
  #   /meeting/order/{id}/reservable/date 跟服务端核一次。算早了只是多问几轮。

  # 翻页时刻前后，多快问一次服务端「放开了没」，快问持续多久
  window_poll_ms: 300
  window_burst_seconds: 180
  # 快问过了还没放开（多半是本地把工作日算早了，比如撞上节假日），降到这个间隔慢慢问
  window_idle_seconds: 300

  # 窗口开放前多久醒过来盯着。太小会因为线程调度错过整点，太大是白等。
  preroll_ms: 800

  # 「盲抢」阶段：窗口刚开的头几秒，不查直接对候选第一名发预定。
  # ⚠ 窗口没开时 spaces 接口返回 0 条，所以预热只能拿到会议室花名册
  #   （roomId/容量/位置，和日期无关），拿不到「那天谁空着」。但窗口刚开的
  #   一瞬间几乎所有房都是空的，所以这一枪值得打 —— 省掉一次「查询→提交」的往返。
  #   目标日期本来就已经在窗口内时不会走这个阶段（那时候房多半被订掉一部分了，
  #   盲打纯属浪费往返），直接进查询驱动。
  blind_seconds: 3
  blind_tries: 6

  # 查询驱动阶段：每轮查一次空位，最多试几个候选，轮询间隔多少
  poll_ms: 700
  tries_per_round: 5

  # 一间房刚回过话（被占 / 报错）之后，至少隔多久才再对它发一次预定。
  # ⚠ 这个不是性能调优，是**正确性**：候选排序是确定性的，没有这个冷却，
  #   每轮取到的永远是同样那几间，46 秒能对它们打三百多枪（2026-08-24 实测），
  #   界面上就是「一直在抢相同的几个会议室」。有了它候选才会自然往后轮。
  #   设小了等于没有；设太大则别人取消时补不上，20 秒是个折中。
  retry_room_seconds: 20

  # 一个能打的候选都没有时的轮询间隔。空转时还按 poll_ms 转，
  # 等于 10 分钟里把 spaces 的分页翻上千遍，纯给内网后台添堵。
  idle_poll_ms: 3000

  # 目标日**已经在可预定范围内**（不是掐点抢）时，连着几轮一个能打的候选都没有
  # 就收摊，报「没有符合条件的会议室」而不是空等到 grab_timeout_seconds。
  # ⚠ 只对这种情况生效。掐 10:00 抢的场景不提前收 —— 那时候别人随时可能取消。
  give_up_rounds: 3

  # 长时间盯着时，多久在界面上报一次「还活着 + 现在什么情况」。
  # 没有它的话，抢不到的那 10 分钟界面上一个字都没有，看着就像卡死了。
  heartbeat_seconds: 30

  # 单次抢占最多耗多久（秒）。超时就放弃这一天；每周循环的任务会接着排下一周。
  grab_timeout_seconds: 600

  # 提醒时间，和页面默认一致：0=不提醒 1=准时 2=提前15分钟 3=提前30分钟
  # 4=提前1小时 5=提前2小时 6=提前1天
  reminder_time: 2

# ============================================================
# 界面上「楼栋」下拉的选项
# ============================================================
# ⚠ 楼栋不走服务端过滤。spaces 接口的 location 条件是坏的：传楼栋 id 返回 0 条，
#   传字符串（nodeKey / code / 中文名）后端直接 500（"For input string: xxx"）。
#   所以这里的值是拿来和接口返回的 location 字段（形如「国正中心/2号楼/5F」）
#   做子串匹配的，在客户端筛。
# 这份清单是 2026-08-19 从全站 318 间会议室的 location 里汇总出来的。
# 行政新开园区时在这里加一行就行，不用改代码。
buildings:
  - 国正中心/2号楼
  - 国正中心/1号楼
  - 国正中心/3号楼
  - 尚浦汇/3号楼
  - 国华广场/A座
  - 东煌大厦/1号楼
  - 乌镇产业园（嘉兴）/3号楼
  - 国际研发总部园（南京）/2栋
  - 边城大厦（南京）/南京边城
  - 广告产业园（芜湖）/火炬楼
  - 光谷E城（武汉）/E3栋
  - 紫光芯云中心（成都）/B栋
  - 互联网产业园（重庆）/13栋
  - 保利发展广场（广州）/保利发展广场
  - 卓越后海中心（深圳）/卓越后海中心（深圳）
