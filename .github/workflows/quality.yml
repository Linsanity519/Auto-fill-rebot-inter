name: Project quality

on:
  pull_request:
  push:
    branches: ["**"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Architecture, governance and offline regression checks
        run: python tools/check_project.py
      - name: Isolated task host process acceptance (no live platform)
        run: python tools/test_task_host_process.py
