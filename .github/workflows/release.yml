name: Build and publish release

# 发一版会产出三个文件：
#   ConfigAssistant-<ver>.zip        代码包，~300KB —— 日常更新下的是它
#   ConfigAssistant-Setup-<ver>.exe  完整安装包，~45MB —— 首次安装 / 运行时变了才需要
#   latest.json                      更新描述，客户端按它决定下哪个
#
# ⚠ GitHub Release 在国内实测只有 20~40KB/s。所以：
#   ① 日常更新走 300KB 的代码包（约 8 秒），而不是几十 MB 的安装包；
#   ② 仓库变量 MIRROR_BASE_URL 若配了国内镜像，会被写在下载地址列表的**最前面**，
#     GitHub 只作兜底。客户端按顺序试到通为止（见 src/update.py 的 _fetch_to）。

# ⚠ 发版前必须先在 CHANGELOG.md 里写好这一版那一节（## X.Y.Z）。
#   那一节的正文会进 latest.json 的 notes —— 也就是同事在程序里看到的
#   「这次更新了什么」——同时当 Release 正文。没写就直接让这次发版失败，
#   因为 notes 缺失是静默的，发出去才发现就晚了。
#
# 推一个 vX.Y.Z 标签就会自动打包发布。
# CI 打出来的包不是「没人测过的二进制」：build.bat 最后一步会跑自检，
# 把打好的 exe 真启动一遍 import 全部依赖，不通过直接让这次发版失败。
# 想用本地打好的那份发，则跑 tools/publish_github_release.py（需要 gh）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号，例如 1.0.9"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      CI: true
      GH_TOKEN: ${{ github.token }}
      # ⚠ 打包脚本会打印中文。runner 是英文环境，输出又被重定向，Python 会用
      #   cp1252 编码 stdout 直接崩（实测炸过一次，报在 print 那一行，像功能出错
      #   其实只是编码）。工具脚本自己也 reconfigure 了，这里再兜一层。
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      # 统计回传地址默认取仓库里的 config/webhook.txt，不配 Secret 也能正常打包。
      # 配了这个 Secret 就以它为准（想换统计群时用），见 tools/inject_release_config.py。
      USAGE_WEBHOOK_URL: ${{ secrets.USAGE_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          choco install innosetup --no-progress --yes

      - name: Check stats webhook is present
        shell: pwsh
        run: |
          # 统计回传一旦缺失是**静默**失效的，所以在这儿显式拦一道。
          if (-not $env:USAGE_WEBHOOK_URL -and -not (Test-Path config/webhook.txt)) {
            throw "既没有 config/webhook.txt，也没配 USAGE_WEBHOOK_URL —— 这一版发出去同事的使用统计会静默失效。"
          }

      - name: Build installer and payload
        id: build
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            "${{ inputs.version }}"
          } else {
            $env:GITHUB_REF_NAME -replace '^v', ''
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "版本号必须是 X.Y.Z：$version" }
          $sourceVersion = python -c "from src import __version__; print(__version__)"
          if ($sourceVersion -ne $version) {
            throw "源码版本是 $sourceVersion；请先把 src/__init__.py 更新为 $version 并提交，再创建标签。"
          }
          # 更新说明缺失是**静默**的：发出去了才发现同事在更新提示里只看到一个
          # 版本号，而那时候包已经在 Release 上了。所以在这儿拦一道，而且要拦在
          # build 之前 —— build 要好几分钟，没必要为一句忘了写的说明白等。
          python tools/changelog.py $version --plain | Out-File -Encoding utf8 "$env:RUNNER_TEMP/notes.txt"
          if ($LASTEXITCODE -ne 0) { throw "CHANGELOG.md 里没有 $version 这一节，先补上再发版。" }
          python tools/changelog.py $version | Out-File -Encoding utf8 "$env:RUNNER_TEMP/notes.md"
          if ($LASTEXITCODE -ne 0) { throw "抠 $version 的 markdown 更新说明失败。" }
          $runtime = (Get-Content RUNTIME_ID -Raw).Trim()
          $env:RELEASE_VERSION = $version
          cmd /c build.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "version=$version" >> $env:GITHUB_OUTPUT
          "runtime=$runtime" >> $env:GITHUB_OUTPUT

      - name: Generate update manifest
        shell: pwsh
        run: |
          $version = "${{ steps.build.outputs.version }}"
          $runtime = "${{ steps.build.outputs.runtime }}"
          $gh = "https://github.com/${{ github.repository }}/releases/download/v$version"
          # 国内镜像放前面，GitHub 兜底。没配镜像就只有 GitHub。
          $bases = @()
          if ("${{ vars.MIRROR_BASE_URL }}") {
            $bases += "--base-url"
            $bases += "${{ vars.MIRROR_BASE_URL }}/v$version"
          }
          $bases += "--base-url"
          $bases += $gh
          python tools/make_update_manifest.py `
            --version $version `
            --runtime $runtime `
            --payload "dist/ConfigAssistant-$version.zip" `
            --installer "dist/ConfigAssistant-Setup-$version.exe" `
            --notes-file "$env:RUNNER_TEMP/notes.txt" `
            @bases

      - name: Create GitHub Release
        shell: pwsh
        run: |
          $version = "${{ steps.build.outputs.version }}"
          # 正文用 CHANGELOG 里那一节（人话），--generate-notes 生成的提交列表
          # 会接在它后面，想看细节的人还能往下翻。
          gh release create "v$version" `
            "dist/ConfigAssistant-$version.zip" `
            "dist/ConfigAssistant-Setup-$version.exe" `
            "dist/latest.json" `
            --title "配置助手 v$version" `
            --notes-file "$env:RUNNER_TEMP/notes.md" `
            --generate-notes --repo "${{ github.repository }}"
